<!doctype html><html><head><style>body{background:#263944;color:#fff;font:16px sans-serif;margin:20px}canvas{background:#52646b;display:block;margin:8px 0 24px}button{padding:10px;margin-right:10px}</style></head><body><h1>Animation review</h1><button id="pause">Pause</button><button id="step">Next frame</button><span id="frame"></span><div id="strips"></div><script type="module">
import {Animation} from '/animation.js';
const a=new Animation(),specs=[['run',2],['jump',2],['blade',3]],rows=[];
for(const [name,n] of specs){const img=new Image();img.src=`/assets/${name}-v2.png`;await img.decode();a.load(name,img,4,n);const label=document.createElement('h2');label.textContent=name;document.querySelector('#strips').append(label);const c=document.createElement('canvas');c.width=1200;c.height=190;document.querySelector('#strips').append(c);rows.push([name,c.getContext('2d')]);}
let time=0,last=0,paused=false;document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#step').onclick=()=>{paused=true;time+=1/18;};
function tick(now){if(!paused)time+=(now-last)/1000;last=now;const f=Math.floor(time*18);document.querySelector('#frame').textContent=`Frame ${f%8}`;for(const [name,c]of rows){c.clearRect(0,0,1200,190);const n=a.atlases[name].frames.length;for(let i=0;i<8;i++){const frame=i===0?f%n:(i-1+Math.floor(f/n)*7)%n;a.drawFrame(c,{atlas:name,frame},65+i*150,165,1);c.fillStyle='white';c.fillText(i===0?'PLAY':String(frame),30+i*150,185);}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
