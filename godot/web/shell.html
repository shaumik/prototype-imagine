<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Highway Phantom — Play</title>
  <meta name="description" content="An action daydream through a moving car window. Jump, dash and fight alongside the ride.">
  <style>
    :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#08131d; color:#e6f3ed; }
    * { box-sizing:border-box; }
    body { margin:0; height:100dvh; overflow:hidden; }
    #game { position:relative; width:100%; height:calc(100dvh - 38px); background:#060e17; }
    #canvas { display:block; width:100%; height:100%; outline:none; }
    #game:fullscreen { height:100dvh; }
    #loading { position:absolute; inset:0; display:grid; place-content:center; gap:18px; text-align:center; background:radial-gradient(ellipse at 60% 25%,#334953,#08131d 65%); }
    #loading h1 { margin:0; font-size:clamp(32px,5vw,58px); font-weight:700; letter-spacing:.08em; }
    #loading p { color:#a3beb9; margin:0; font-size:14px; }
    progress { width:min(340px,70vw); height:4px; margin:auto; border:0; background:#253a43; accent-color:#86fff0; }
    progress::-webkit-progress-bar { background:#253a43; }
    progress::-webkit-progress-value { background:#86fff0; }
    footer { position:fixed; bottom:0; left:0; right:0; z-index:2; height:38px; padding:0 16px; display:flex; align-items:center; gap:16px; color:#91aba9; background:#08131d; font-size:11px; letter-spacing:.03em; }
    footer p { margin:0; flex:1; }
    kbd { color:#d3eee7; font:inherit; }
    button { border:1px solid #35505b; border-radius:4px; background:#122631; padding:5px 12px; color:#aaffed; font:inherit; cursor:pointer; }
    button:hover,button:focus-visible { background:#25434a; outline:1px solid #86fff0; }
    #failure { max-width:540px; padding:20px; line-height:1.7; white-space:pre-wrap; }
    @media (max-width:750px) { .extra { display:none; } footer { gap:6px; font-size:10px; padding:0 8px; } }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="game">
    <canvas id="canvas" tabindex="0" aria-label="Highway Phantom game. Enter to start. Space to jump, J to fire, K to charge, tap L three times for the sword combo, Shift to dash, Escape to pause.">Your browser needs canvas support to play.</canvas>
    <div id="loading" role="status" aria-live="polite">
      <h1>HIGHWAY PHANTOM</h1>
      <p id="message">Getting the ride ready…</p>
      <progress id="progress" aria-label="Loading the game"></progress>
      <div id="failure" hidden></div>
    </div>
  </main>
  <footer>
    <p><kbd>Enter</kbd> start · <kbd>Space</kbd> jump · <kbd>J</kbd> fire · <kbd>K</kbd> charge · <kbd>L ×3</kbd> sword combo · <kbd>Shift</kbd> dash<span class="extra"> · <kbd>Esc</kbd> pause · <kbd>M</kbd> sound</span></p>
    <button id="fullscreen" type="button">Fullscreen ↗</button>
  </footer>
  <noscript>Enable JavaScript to play Highway Phantom.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const canvas = document.getElementById('canvas');
    const game = document.getElementById('game');
    function resizeCanvas() {
      const directFullscreen = document.fullscreenElement === canvas;
      const width = directFullscreen ? innerWidth : game.clientWidth;
      const height = directFullscreen ? innerHeight : game.clientHeight;
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
    }
    resizeCanvas();
    new ResizeObserver(resizeCanvas).observe(game);
    document.addEventListener('fullscreenchange', resizeCanvas);
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const message = document.getElementById('message');
    const engine = new Engine(config);
    function failure(error) {
      console.error(error);
      message.textContent = 'The game could not start.';
      progress.hidden = true;
      const notice = document.getElementById('failure');
      notice.hidden = false;
      notice.textContent = error instanceof Error ? error.message : String(error);
    }
    const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
    if (missing.length) {
      failure('This browser is missing: ' + missing.join(', ') + '. Try a current desktop Chrome, Firefox, or Edge.');
    } else {
      engine.startGame({
        canvas,
        onProgress(current,total) {
          if (total > 0) { progress.max = total; progress.value = current; }
          message.textContent = current === total && total > 0 ? 'Starting your daydream…' : 'Getting the ride ready…';
        }
      }).then(() => {
        loading.remove();
        canvas.focus();
        document.documentElement.dataset.gameReady = 'true';
      }).catch(failure);
    }
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus());
    document.getElementById('fullscreen').addEventListener('click', async () => {
      const button = document.getElementById('fullscreen');
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.getElementById('game').requestFullscreen();
        canvas.focus();
      } catch (error) {
        button.textContent = 'Use browser fullscreen';
      }
    });
  </script>
</body>
</html>
